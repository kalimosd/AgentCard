<!doctype html>
<!-- Hardware profile: strip-800x240. See hardware/README.md before changing the target size. -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentCard · 硬件原型</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 100vw; height: 100vh; overflow: hidden;
        background: #0f1413; color: #e8edec;
        font-family: "SF Pro Display", Inter, ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      :root {
        --accent: #2dd4bf; --ok: #34d399; --wait: #fbbf24; --fail: #f87171; --idle: #64748b;
        --tone: var(--idle);
        --right-w: clamp(216px, 30vw, 248px);
      }

      body.tone-working   { --tone: var(--accent); }
      body.tone-waiting   { --tone: var(--wait); }
      body.tone-done      { --tone: var(--ok); }
      body.tone-failed    { --tone: var(--fail); }
      body.scene-question { --right-w: clamp(316px, 41vw, 342px); }

      /* ============ strip ============ */
      .strip {
        width: 100vw; height: 100vh;
        display: grid;
        grid-template-columns: minmax(0, 1fr) var(--right-w);
        align-items: center;
        gap: 16px;
        padding: 18px 20px;
        transition: grid-template-columns 180ms ease;
      }

      .identity {
        min-width: 0; height: clamp(76px, 38vh, 92px);
        display: flex; align-items: center; gap: 12px;
        padding: 8px 14px 8px 8px;
        border-radius: 18px;
        background:
          linear-gradient(90deg, rgba(255,255,255,0.075), rgba(255,255,255,0.025) 68%, transparent);
        border: 1px solid rgba(255,255,255,0.09);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
      }

      /* ============ beaver ============ */
      .mascot {
        position: relative; isolation: isolate;
        width: clamp(56px, 9vw, 76px); height: clamp(56px, 9vw, 76px);
        border-radius: 16px; overflow: hidden;
        background:
          radial-gradient(circle at 50% 18%, rgba(255,255,255,0.12), transparent 42%),
          linear-gradient(145deg, rgba(255,255,255,0.07), rgba(255,255,255,0.025));
        border: 1px solid rgba(255,255,255,0.12);
        display: grid; place-items: center; flex: 0 0 auto;
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.06),
          0 12px 22px rgba(0,0,0,0.22);
      }
      .mascot::after {
        content: "";
        position: absolute; left: 15%; right: 15%; bottom: 7px; height: 7px;
        border-radius: 999px; background: var(--tone); opacity: 0.2;
        filter: blur(6px); z-index: -1;
      }
      .mascot img {
        width: 108%; height: 108%; object-fit: contain; object-position: center;
        filter: drop-shadow(0 7px 7px rgba(0,0,0,0.42));
        transform-origin: 50% 78%;
        animation: pet-idle 3.2s ease-in-out infinite;
        will-change: transform;
      }
      body.scene-working .mascot img { animation-name: pet-work; animation-duration: 2.4s; }
      body.scene-approval .mascot img,
      body.scene-question .mascot img { animation-name: pet-wait; animation-duration: 1.8s; }
      body.scene-failed .mascot img { animation-name: pet-alert; animation-duration: 0.42s; }
      body.scene-done .mascot img { animation-name: pet-done; animation-duration: 2.2s; }
      body.scene-question .mascot::after,
      body.scene-approval .mascot::after { animation: pet-glow 1.8s ease-in-out infinite; }

      /* ============ status ============ */
      .status { min-width: 0; }
      .status-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }

      .dot {
        width: 7px; height: 7px; border-radius: 50%; background: var(--tone); flex-shrink: 0;
        box-shadow: 0 0 12px var(--tone);
      }
      body.tone-working .dot, body.tone-waiting .dot { animation: pulse 1.4s infinite; }

      .state-label {
        font-size: 11px; font-weight: 800; text-transform: uppercase;
        letter-spacing: 0.04em; color: var(--tone);
      }
      .agent-badge {
        font-size: 9px; font-weight: 700; color: #9aa8a2;
        padding: 1px 6px; border-radius: 99px;
        background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      }
      .action {
        font-size: 14px; font-weight: 700; line-height: 1.28;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }

      /* ============ right: metrics (quiet) ============ */
      .right {
        width: var(--right-w);
        display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex-shrink: 0;
      }
      .metrics {
        min-width: 170px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
      }
      .metric {
        display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
        padding: 7px 9px; border-radius: 10px;
        background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.075);
      }
      .metric-label { font-size: 8px; line-height: 1.1; color: #7e8d86; text-transform: uppercase; font-weight: 700; }
      .metric-val { font-weight: 800; font-size: 12px; line-height: 1.15; }

      /* ============ compact intervention (permission / failed / done) ============ */
      .intervention-compact {
        width: 100%; min-height: 58px;
        display: grid; grid-template-columns: 18px minmax(0, 1fr) auto auto; align-items: center; gap: 8px;
        padding: 8px 10px;
        border-radius: 14px;
        background: rgba(255,255,255,0.06); border: 1px solid var(--tone);
        border-left: 4px solid var(--tone);
        box-shadow: 0 10px 26px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.05);
      }
      .intervention-compact .ico { flex-shrink: 0; color: var(--tone); }
      .intervention-compact .txt { min-width: 0; }
      .intervention-compact .title {
        font-size: 11px; font-weight: 800; line-height: 1.15;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--tone);
      }
      .intervention-compact .detail {
        font-size: 10px; color: #9aa8a2; line-height: 1.2; margin-top: 2px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }

      /* ============ expanded question panel ============ */
      /* When a question arrives, the right area expands to show full option text.
         On the physical strip (800×200), the right side can take ~400px to show
         options with ~80 chars each. */
      .question-panel {
        width: 100%;
        display: flex; flex-direction: column; gap: 6px;
        padding: 9px;
        border-radius: 14px;
        background: rgba(255,255,255,0.04); border: 1px solid var(--tone);
        box-shadow: 0 12px 28px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.05);
      }
      .question-header {
        font-size: 10px; line-height: 1.2; font-weight: 800; color: var(--tone);
        text-transform: uppercase; letter-spacing: 0.04em;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .question-option {
        display: grid;
        grid-template-columns: 22px 1fr;
        align-items: center; gap: 8px;
        min-height: 31px;
        padding: 4px 8px 4px 5px;
        border-radius: 8px;
        background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
        cursor: pointer; transition: background 0.15s;
        font: inherit; color: inherit; text-align: left; width: 100%;
      }
      .question-option:hover { background: rgba(45,212,191,0.1); border-color: var(--accent); }
      .question-option:active { background: rgba(45,212,191,0.2); }
      .question-option .idx {
        display: grid; place-items: center;
        width: 22px; height: 22px;
        border-radius: 6px; background: var(--accent); color: #04211c;
        font-size: 11px; font-weight: 900; flex-shrink: 0;
      }
      .question-option .text {
        font-size: 11px; font-weight: 700; line-height: 1.26;
        overflow: hidden; text-overflow: ellipsis;
        /* On narrow strip (200px tall), keep to 2 lines; on wider, 1 line */
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      }

      /* ============ buttons ============ */
      .btn {
        display: inline-flex; align-items: center; justify-content: center;
        min-width: 36px; min-height: 30px;
        padding: 0 10px; border-radius: 9px;
        border: none; font: inherit; font-size: 11px;
        font-weight: 700; cursor: pointer; color: #04211c; background: var(--accent);
      }
      .btn-ghost {
        background: transparent; color: var(--tone); border: 1px solid rgba(255,255,255,0.15);
      }

      @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }
      @keyframes pet-idle {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-2px) scale(1.015); }
      }
      @keyframes pet-work {
        0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
        45% { transform: translateY(-2px) rotate(-1.6deg) scale(1.018); }
        72% { transform: translateY(1px) rotate(1deg) scale(0.997); }
      }
      @keyframes pet-wait {
        0%, 100% { transform: translateY(0) rotate(-1.5deg) scale(1); }
        50% { transform: translateY(-2px) rotate(2deg) scale(1.02); }
      }
      @keyframes pet-alert {
        0%, 100% { transform: translateX(0) rotate(0deg) scale(1); }
        25% { transform: translateX(-2px) rotate(-2.2deg) scale(1.01); }
        75% { transform: translateX(2px) rotate(2.2deg) scale(1.01); }
      }
      @keyframes pet-done {
        0%, 100% { transform: translateY(0) scale(1); }
        18% { transform: translateY(-4px) scale(1.04); }
        34% { transform: translateY(1px) scale(0.99); }
        52% { transform: translateY(-2px) scale(1.015); }
      }
      @keyframes pet-glow {
        0%, 100% { opacity: 0.18; transform: scaleX(0.82); }
        50% { opacity: 0.36; transform: scaleX(1); }
      }

      .scenario-switcher {
        position: fixed; bottom: 6px; right: 6px; z-index: 99;
        display: flex; gap: 4px; opacity: 0.5;
      }
      body.hide-controls .scenario-switcher { display: none; }
      .scenario-switcher button { font-size: 9px; padding: 2px 5px; }

      /* ============ adaptive ============ */
      @media (max-width: 550px) {
        .strip { grid-template-columns: 1fr; gap: 10px; align-content: center; }
        .mascot { display: none; }
        .identity { height: auto; min-height: 62px; padding: 10px 12px; }
        .right { width: 100%; justify-content: stretch; }
        .right > * { width: 100%; }
      }
      @media (max-width: 380px) {
        .strip { justify-items: center; text-align: center; }
      }
      @media (prefers-reduced-motion: reduce) {
        .dot, .mascot img, .mascot::after { animation: none !important; }
      }
    </style>
  </head>
  <body class="tone-working scene-working">
    <div class="strip">
      <!-- identity -->
      <div class="identity">
        <div class="mascot">
          <img src="pet-happy.png" alt="河狸" id="mascotImg" />
        </div>

        <!-- status -->
        <div class="status" id="statusArea">
          <div class="status-row">
            <span class="dot"></span>
            <span class="state-label" id="stateLabel">思考中</span>
            <span class="agent-badge" id="agentBadge">CLAUDE</span>
          </div>
          <p class="action" id="action">正在重构 auth 模块的安全性</p>
        </div>
      </div>

      <!-- right block -->
      <div class="right" id="right">
        <div class="metrics">
          <div class="metric"><span class="metric-label">tokens</span><span class="metric-val">2.4k</span></div>
          <div class="metric"><span class="metric-label">今日</span><span class="metric-val">$0.42</span></div>
        </div>
      </div>
    </div>

    <!-- scenario buttons -->
    <div class="scenario-switcher">
      <button onclick="show('working')">工作中</button>
      <button onclick="show('approval')">权限</button>
      <button onclick="show('question')">问题</button>
      <button onclick="show('failed')">失败</button>
      <button onclick="show('done')">完成</button>
    </div>

    <script>
      const params = new URLSearchParams(location.search);
      const controlsHidden = params.has('clean') || params.has('capture');

      function show(name) {
        document.body.className = `${SCENES[name].tone} scene-${name}${controlsHidden ? ' hide-controls' : ''}`;
        document.getElementById('stateLabel').textContent = SCENES[name].state;
        document.getElementById('agentBadge').textContent = SCENES[name].agent;
        document.getElementById('action').textContent = SCENES[name].action;
        document.getElementById('right').innerHTML = SCENES[name].right;

        const m = { 'tone-failed': 'angry', 'tone-waiting': 'confused' };
        const mood = m[SCENES[name].tone] || 'happy';
        document.getElementById('mascotImg').src = `pet-${mood}.png`;
      }

      const SCENES = {
        working: {
          tone: 'tone-working', state: '思考中', agent: 'CLAUDE',
          action: '正在重构 auth 模块的安全性',
          right: `<div class="metrics">
            <div class="metric"><span class="metric-label">tokens</span><span class="metric-val">2.4k</span></div>
            <div class="metric"><span class="metric-label">今日</span><span class="metric-val">$0.42</span></div>
          </div>`
        },

        approval: {
          tone: 'tone-waiting', state: '等待权限', agent: 'CLAUDE',
          action: '请求执行 shell 命令',
          right: `<div class="intervention-compact">
            <span class="ico" style="font-size:clamp(14px,2vw,18px)">&#9888;</span>
            <div class="txt">
              <div class="title">权限确认</div>
              <div class="detail">Bash: npm test</div>
            </div>
            <button class="btn">Yes</button>
            <button class="btn btn-ghost">No</button>
          </div>`
        },

        question: {
          tone: 'tone-waiting', state: '等待回答', agent: 'CLAUDE',
          action: 'Codex 需要你在三个方向中选择',
          right: `<div class="question-panel">
            <span class="question-header">请选择下一步方向</span>
            <button class="question-option" onclick="selectOption(this,1)">
              <span class="idx">1</span>
              <span class="text">先澄清需求边界，写一份产品规格，再进入实现计划</span>
            </button>
            <button class="question-option" onclick="selectOption(this,2)">
              <span class="idx">2</span>
              <span class="text">直接实现最小可用版本，但保留后续协议回传扩展点</span>
            </button>
            <button class="question-option" onclick="selectOption(this,3)">
              <span class="idx">3</span>
              <span class="text">暂停实现，先做 Case 1 / Case 2 的视觉方案对比</span>
            </button>
          </div>`
        },

        failed: {
          tone: 'tone-failed', state: '失败', agent: 'CLAUDE',
          action: 'npm run lint · exit 127',
          right: `<div class="intervention-compact" style="border-color:var(--fail)">
            <span class="ico" style="font-size:clamp(14px,2vw,18px)">&#10005;</span>
            <div class="txt">
              <div class="title">命令失败</div>
              <div class="detail">Missing script: lint</div>
            </div>
            <button class="btn">OK</button>
          </div>`
        },

        done: {
          tone: 'tone-done', state: '已完成', agent: 'CLAUDE',
          action: 'v0.1 demo 完成 · 18.4k tokens',
          right: `<div class="metrics">
            <div class="metric"><span class="metric-label">tokens</span><span class="metric-val">18.4k</span></div>
            <div class="metric"><span class="metric-label">今日</span><span class="metric-val">$2.47</span></div>
          </div>`
        }
      };

      function selectOption(el, num) {
        // Visual feedback: mark selected, dim others
        const panel = el.parentElement;
        panel.querySelectorAll('.question-option').forEach(opt => {
          opt.style.opacity = '0.4';
          opt.style.borderColor = 'rgba(255,255,255,0.08)';
        });
        el.style.opacity = '1';
        el.style.borderColor = 'var(--accent)';
        el.style.background = 'rgba(45,212,191,0.15)';
        el.querySelector('.idx').textContent = '✓';
      }

      // URL param auto-select: ?question, ?approval, etc.
      const p = [...params.keys()].find(key => SCENES[key]);
      if (p && SCENES[p]) show(p);
      else if (controlsHidden) document.body.classList.add('hide-controls');

      // Debug panel — append ?debug to URL to see layout metrics
      if (location.search.includes('debug')) {
        setTimeout(() => {
          const els = {};
          ['.strip','.mascot','.action','.right','.question-panel','.intervention-compact','.metrics'].forEach(s => {
            const e = document.querySelector(s);
            if (e) { const r = e.getBoundingClientRect();
              els[s] = `${Math.round(r.width)}×${Math.round(r.height)} pos(${Math.round(r.x)},${Math.round(r.y)})`; }
          });
          els.overflow = `scrollW=${document.body.scrollWidth} vw=${window.innerWidth} scrollH=${document.body.scrollHeight} vh=${window.innerHeight}`;
          const pre = document.createElement('pre');
          pre.id='debug'; pre.style.cssText='position:fixed;top:0;left:0;z-index:999;background:rgba(0,0,0,0.85);color:#0f0;font-size:8px;padding:3px;max-width:100%;line-height:1.2';
          pre.textContent = Object.entries(els).map(([k,v])=>`${k}: ${v}`).join('\n');
          document.body.appendChild(pre);
        }, 800);
      }
    </script>
  </body>
</html>
